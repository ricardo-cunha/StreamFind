[build-system]
requires = [
  "scikit-build-core>=0.10",
  "cf-package-contracts",
  "cf-step-tooling",
]
build-backend = "scikit_build_core.build"

[project]
name = "cf-streamfind"
version = "0.1.1"
description = "CogniFlow package with processing steps based on the streamfind native algorithms."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3" }
authors = [
  { name = "IUTA" },
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
]

[project.entry-points."cogniflow.steps"]
"cf.streamfind" = "cf_streamfind:steps.nq"

[tool.scikit-build]
minimum-version = "0.10"

[tool.scikit-build.wheel]
packages = ["src/cf_streamfind"]

[tool.scikit-build.experimental]
wheels = true

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cf_streamfind = ["steps.nq", "bin/*", "libs/*", "resources/openbabel/data/*"]
