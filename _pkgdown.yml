url: https://odea-project.github.io/StreamFind/

template:
  bootstrap: 5
  bslib:
    bootswatch: flatly
  assets:
    - pkgdown/extra.css

home:
  title: StreamFind
  description: >
    DuckDB-backed project framework for mass spectrometry and non-target
    analysis workflows in R.

navbar:
  structure:
    left:
      - home
      - reference
      - articles
      - news
    right:
      - github
  components:
    home:
      text: Home
      href: index.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
        - text: Package Overview
          href: articles/StreamFind.html
    news:
      text: News
      href: news/index.html
    github:
      icon: fab fa-github
      href: https://github.com/odea-project/StreamFind

reference:
  - title: Project Framework
    desc: >
      Core classes for persistent project state, workflow definition, and
      method metadata.
    contents:
      - Project
      - ProjectS3
      - Workflow
      - Method

  - title: Open Project Classes
    desc: >
      Constructors for opening or creating the main project child classes.
    contents:
      - open_ProjectMassSpecSpectra
      - open_ProjectMassSpecChromatograms
      - open_ProjectNonTargetAnalysis
      - projects_overview

  - title: Mass Spectrometry Projects
    desc: >
      DuckDB-backed project interfaces for raw spectra and chromatogram access.
    contents:
      - ProjectMassSpec
      - ProjectMassSpecS3
      - ProjectMassSpecSpectra
      - ProjectMassSpecSpectraS3
      - ProjectMassSpecChromatograms
      - ProjectMassSpecChromatogramsS3

  - title: Non-Target Analysis Project
    desc: >
      Project interface for native feature finding, screening, correction, and
      result inspection workflows.
    contents:
      - ProjectNonTargetAnalysis
      - ProjectNonTargetAnalysisS3

  - title: Non-Target Analysis Methods
    desc: >
      Workflow method constructors for the native non-target-analysis backend.
    contents:
      - starts_with("Method_NonTargetAnalysis_")

  - title: Templates and Helpers
    desc: >
      Utility functions for workflow setup, template generation, and data
      preparation.
    contents:
      - get_template_suspect_screening_csv
      - get_suspects_screening_csv
      - get_suspects_screening_csv_obabel
      - rcpp_get_suspects_screening_csv
      - get_template_transformation_products_screening_csv
      - search_transformation_products_biotransformer
      - convert_ms_files
      - trim_ms_files_spectra
      - db_helpers
      - run_app

  - title: Package
    contents:
      - StreamFind-package
