[package]
name = "streamfind-rust-core"
version.workspace = true
edition = "2021"

[lib]
name = "streamfind_rust_core"

[dependencies]
duckdb = { version = "1", features = ["bundled", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streamfind-rust-external = { path = "../external" }

[dev-dependencies]
streamfind-rust-test-support = { path = "../test-support" }
