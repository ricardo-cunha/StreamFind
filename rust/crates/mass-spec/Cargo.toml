[package]
name = "streamfind-rust-mass-spec"
version.workspace = true
edition = "2021"
autotests = false

[features]
# Direct reader-interface tests depend on local vendor fixtures and are not
# part of the normal/distribution workspace test suite. Opt in explicitly:
# cargo test -p streamfind-rust-mass-spec --features reader-interface-tests
reader-interface-tests = []

[dependencies]
streamfind-rust-core = { path = "../core" }
streamfind-rust-external = { path = "../external" }
serde_json = "1"
base64 = "0.22"
cfb = "0.14"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
quick-xml = "0.38"
regex = "1"

duckdb = { version = "1.10504.0", features = ["bundled"] }
zstd = "0.13"

[dev-dependencies]
streamfind-rust-test-support = { path = "../test-support" }

# Keep direct reader-interface tests available to reader developers, but out of
# the default/distribution workspace test suite. Run them with:
# cargo test -p streamfind-rust-mass-spec --features reader-interface-tests
[[test]]
name = "reader"
path = "tests/reader.rs"
required-features = ["reader-interface-tests"]

[[test]]
name = "reader_agilent"
path = "tests/reader_agilent.rs"
required-features = ["reader-interface-tests"]

